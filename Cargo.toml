[package]
name = "ferris-workflow"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false

[workspace]
exclude = ["e2e"]
members = ["migration", "crates/workflow-editor"]
default-members = [".", "migration"]


[workspace.dependencies]
automod = "1.0"
sea-orm-migration = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"], default-features = false }
tokio = { version = "1", features = ["full"] }
[dependencies]
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }
dioxus-icons = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
ferris-workflow-editor = { path = "crates/workflow-editor" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
automod.workspace = true
axum = { version = "0.8" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
migration = { path = "migration" }
serde_with = "3.16"
sea-orm = { version = "2.0", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono", "with-json", "with-uuid", "schema-sync", "entity-registry", "rbac"], default-features = false }
tower-http = { version = "0.6", features = ["set-header"] }
validator = { version = "0.21", features = ["derive"] }
serverless_workflow_core = { git = "https://github.com/open-workflow-specification/sdk-rust", rev = "12d7c5b2ef76bc5186f949e3a3d649db6a3f3ba5" }
ows-runtime-dsl = { git = "https://github.com/dinosath/ows-runtime-rust", rev = "cf72d94687db54d6de8ff0806bbaf2c37af2e037" }
ows-runtime = { git = "https://github.com/dinosath/ows-runtime-rust", rev = "cf72d94687db54d6de8ff0806bbaf2c37af2e037" }
ows-runtime-core = { git = "https://github.com/dinosath/ows-runtime-rust", rev = "cf72d94687db54d6de8ff0806bbaf2c37af2e037" }
url = "2"

connectrpc = { version = "0.9.1", default-features = false, features = ["json", "axum"] }
buffa = { version = "0.9", features = ["json"] }
tower = { version = "0.5", features = ["util"] }
tokio.workspace = true
mimalloc = { version = "0.1.50", features = ["secure"] }
[dev-dependencies]
axum-test = "21.1"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
reqwest = { version = "0.13", features = ["json", "cookies"], default-features = false }
serial_test = "4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }
wasm-bindgen = "0.2"

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server"]

[build-dependencies]
connectrpc-build = "0.9.0"
prost = "0.14"
protox = "0.9"
