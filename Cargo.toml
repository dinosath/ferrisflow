[package]
name = "ferris-workflow"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/dinosath/ferrisflow"

[package.metadata.dist]
dist = true

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false

[profile.web-release]
inherits = "release"
strip = "none"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace]
exclude = ["e2e"]
members = ["migration"]
default-members = [".", "migration"]


[workspace.dependencies]
automod = "1.0"
sea-orm-migration = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"], default-features = false }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
[dependencies]
dioxus = { version = "0.7.10", features = ["router"], optional = true }
dioxus-icons = { version = "0.1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
ows-workflow-editor = { git = "https://github.com/dinosath/ows-rs", rev = "3e62718bb250fe4b34f944f6337f385daf74bc5c", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["fullstack", "server"], optional = true }
automod.workspace = true
axum = { version = "0.8" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono", "schema-sync"], default-features = false }
tower-http = { version = "0.6", features = ["set-header"] }
validator = { version = "0.21", features = ["derive"] }
serverless_workflow_core = { git = "https://github.com/open-workflow-specification/sdk-rust", rev = "12d7c5b2ef76bc5186f949e3a3d649db6a3f3ba5" }
ows = { git = "https://github.com/dinosath/ows-rs", rev = "3e62718bb250fe4b34f944f6337f385daf74bc5c" }
ows-core = { git = "https://github.com/dinosath/ows-rs", rev = "3e62718bb250fe4b34f944f6337f385daf74bc5c" }
ows-dsl = { git = "https://github.com/dinosath/ows-rs", rev = "3e62718bb250fe4b34f944f6337f385daf74bc5c" }
url = "2"

connectrpc = { version = "0.9.1", default-features = false, features = ["json", "axum"] }
buffa = { version = "0.9", features = ["json"] }
tower = { version = "0.5", features = ["util"] }
tokio.workspace = true
[dev-dependencies]
axum-test = "21.1"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
reqwest = { version = "0.13", features = ["json", "cookies"], default-features = false }
serial_test = "4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }
wasm-bindgen = "0.2"

[features]
default = ["web"]
ui = ["dep:dioxus", "dep:dioxus-icons", "dep:ows-workflow-editor"]
web = ["ui", "dioxus/web"]
mobile = ["ui", "dioxus/mobile"]
server = []
fullstack = ["server", "ui", "dep:dioxus", "dioxus/fullstack"]
api-server = ["server"]

[build-dependencies]
connectrpc-build = "0.9.0"
prost = "0.14"
protox = "0.9"
