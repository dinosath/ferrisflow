name: Clean up temporary releases

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete expired prereleases
    runs-on: ubuntu-latest
    steps:
      - name: Delete prereleases older than 30 days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            for (const release of releases) {
              if (!release.prerelease || !release.published_at || Date.parse(release.published_at) >= cutoff) {
                continue;
              }

              core.info(`Deleting expired prerelease ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${release.tag_name}`,
              });
            }
