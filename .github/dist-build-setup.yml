- name: Install Rust web target
  uses: dtolnay/rust-toolchain@stable
  with:
    targets: wasm32-unknown-unknown
- name: Install Dioxus CLI
  uses: taiki-e/install-action@v2
  with:
    tool: dioxus-cli@0.7.10
- name: Build fullstack frontend assets
  run: dx build --platform web --fullstack false --profile web-release --no-default-features --features web
