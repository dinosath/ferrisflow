apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrisflow-deployment
  labels:
    app: ferrisflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ferrisflow
  template:
    metadata:
      labels:
        app: ferrisflow
    spec:
      containers:
        - name: ferrisflow
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}