[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# Skip checking whether the specified configuration files are up to date
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# Where to host releases
hosting = "github"
# Whether dist should create a Github Release or use an existing draft
create-release = true
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu"]
# Features to pass to cargo build
features = ["fullstack"]
# Whether default-features should be enabled with cargo build
default-features = false
# The installers to generate for each app
installers = ["shell"]
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
include = ["target/dx/ferris-workflow/release/web/public/"]
github-build-setup = "../dist-build-setup.yml"
# Which actions to run on pull requests
pr-run-mode = "upload"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
