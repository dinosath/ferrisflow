[application]
name = "ferrisflow"
default_platform = "web"
asset_dir = "assets"
out_dir = "dist"
tailwind_input = "assets/dioxus-shadcn.css"
tailwind_output = "assets/tailwind.css"

[web.app]
title = "Ferrisflow"

[web.watcher]
watch_path = ["src", "assets"]

[bundle]
identifier = "com.ferrisflow.app"
publisher = "Ferrisflow"

[android]
min_sdk = 24
target_sdk = 35

[android.application]
uses_cleartext_traffic = true
